name: Scraper Sync

on:
  schedule:
    - cron: '0 */6 * * *' # Checks every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install requests beautifulsoup4 urllib3

      - name: Run Smart Scraper
        run: |
          # Run the Python script to scrape the JIIT site
          python scraper.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: synchronize timetable data from scraper"
          title: "New Timetable Data Available (Scraper)"
          body: "A new timetable file has been detected on the JIIT website and downloaded. Please review and merge to trigger parsing. \n\n**Note**: If a PDF file was downloaded, it will be ignored by the parser and requires manual processing."
          branch: "sync-scraper-data"
          base: "main"
