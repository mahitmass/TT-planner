name: Auto Merge Bot PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only auto-merge PRs created by GitHub Actions on our known sync branches
    if: >
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      (github.event.pull_request.head.ref == 'sync-timetable-data' || github.event.pull_request.head.ref == 'sync-scraper-data')
    steps:
      - name: Merge PR
        run: |
          echo "Auto-merging PR #${{ github.event.pull_request.number }} from ${{ github.event.pull_request.head.ref }}"
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --merge \
            --admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Email Notification
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "Schedule Bot <${{ secrets.MAIL_USERNAME }}>"
          to: anonyfuss4anonymous@gmail.com
          subject: "✅ Timetable Auto-Merge Successful"
          body: |
            The scraper bot data was successfully accepted and merged into the main branch!
            
            PR: #${{ github.event.pull_request.number }}
            Branch: ${{ github.event.pull_request.head.ref }}
