name: Re-Generate Data

on:
  push:
    paths:
      - 'parser_tool/**' # Runs whenever you change the parser
      - 'raw_data/**' # Runs whenever new Excel data is added

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: '18'
    - run: cd parser_tool && npm install
    - run: cd parser_tool && node parser.js
    - run: cd parser_tool && node generate_data.js
    - name: Commit and Push
      run: |
        git config --global user.name 'mahitmass'
        git config --global user.email 'mahitmass@users.noreply.github.com'
        git add js/data.js
        git commit -m "🤖 Bot updated data.js" || echo "No changes"
        git push
