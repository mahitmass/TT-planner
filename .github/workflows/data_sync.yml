name: Data Sync

on:
  schedule:
    - cron: '0 */6 * * *' # Checks every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Fetch Data
        run: |
          # Ensure directory exists
          mkdir -p raw_data

          # Smart-clone only the folders we need from senior repo
          git clone --depth 1 --filter=blob:none --sparse https://github.com/codelif/jiit-planner-cdn.git senior_repo
          cd senior_repo
          git sparse-checkout set "raw/time_tables/B.Tech 62 (btech-62)" "raw/time_tables/B.Tech 128 (btech-128)"
          cd ..

          # Iterate over campuses and semesters to copy correctly named files
          for campus in "62" "128"; do
            for sem in "1" "3"; do
              src_file="senior_repo/raw/time_tables/B.Tech $campus (btech-$campus)/$sem/$sem.xlsx"
              dest_file="raw_data/$sem-$campus.xlsx"
              
              if [ -f "$src_file" ]; then
                cp "$src_file" "$dest_file"
                echo "Copied $dest_file"
              fi
            done
          done
          
          # Delete the temp clone
          rm -rf senior_repo

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: synchronize timetable data"
          title: "New Timetable Data Available"
          body: "A new timetable excel file has been detected in the upstream repo. Please review and merge to trigger parsing."
          branch: "sync-timetable-data"
          base: "main"
