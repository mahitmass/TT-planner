name: Data Sync

on:
  schedule:
    - cron: '0 */6 * * *' # Checks every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Fetch Data
        run: |
          # Ensure directory exists
          mkdir -p raw_data

          # Smart-clone only the folders we need from senior repo
          git clone --depth 1 --filter=blob:none --sparse https://github.com/codelif/jiit-planner-cdn.git senior_repo
          cd senior_repo
          git sparse-checkout set "raw/time_tables/B.Tech 62 (btech-62)" "raw/time_tables/B.Tech 128 (btech-128)"
          cd ..

          # Get latest upstream commit SHA
          UPSTREAM_SHA=$(git -C senior_repo rev-parse HEAD)
          echo "Upstream commit SHA: $UPSTREAM_SHA"

          # Read previously saved SHA from main branch (if present)
          LOCAL_LAST_SHA=""
          if [ -f "raw_data/.last_sync_sha" ]; then
            LOCAL_LAST_SHA=$(cat raw_data/.last_sync_sha)
          fi

          # Check if upstream has pushed any new commits
          if [ "$UPSTREAM_SHA" = "$LOCAL_LAST_SHA" ]; then
            echo "No new commit in upstream repository since last sync ($UPSTREAM_SHA). Skipping."
            rm -rf senior_repo
            exit 0
          fi

          # Copy updated files if a new upstream commit exists
          for campus in "62" "128"; do
            for sem in "1" "3"; do
              src_dir="senior_repo/raw/time_tables/B.Tech $campus (btech-$campus)/$sem"
              dest_file="raw_data/$sem-$campus.xlsx"
              
              # Find any .xlsx file in the directory
              src_file=$(find "$src_dir" -maxdepth 1 -name "*.xlsx" 2>/dev/null | head -n 1)
              
              if [ -n "$src_file" ] && [ -f "$src_file" ]; then
                cp "$src_file" "$dest_file"
                echo "Copied $src_file to $dest_file"
              fi
            done
          done
          
          # Save the processed upstream commit SHA
          echo "$UPSTREAM_SHA" > raw_data/.last_sync_sha
          
          # Clean up temp clone
          rm -rf senior_repo

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: synchronize timetable data"
          title: "New Timetable Data Available"
          body: "A new timetable excel file has been detected in the upstream repo. Please review and merge to trigger parsing."
          branch: "sync-timetable-data"
          base: "main"

      - name: Auto Merge PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} \
            --repo ${{ github.repository }} \
            --merge \
            --delete-branch
